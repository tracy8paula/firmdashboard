<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report an issue</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen p-6">
  <div class="max-w-lg mx-auto bg-white rounded border border-slate-400 p-6 mt-8">
    <h1 class="text-2xl font-semibold mb-2">Report an issue</h1>
    <p class="text-md text-slate-500 mb-6">Tell us what's wrong and we'll get back to you.</p>
    <form method="POST" class="space-y-3">
      <div><label class="block text-md border-slate-400 text-slate-600 mb-1">Your name</label><input name="contact_name"
          required class="w-full border rounded px-3 py-2 text-sm"></div>
      <div><label class="block text-md border-slate-400 text-slate-600 mb-1">Phone number</label><input name="phone"
          required class="w-full border rounded px-3 py-2 text-sm"></div>
      <div><label class="block text-md border-slate-400 text-slate-600 mb-1">Hospital / business name</label><input
          name="client" required class="w-full border rounded px-3 py-2 text-sm"></div>
      <div><label class="block text-md border-slate-400 text-slate-600 mb-1">Item</label>
        <select name="item" required class="w-full border rounded px-3 py-2 text-sm">
          {% for item in items %}<option value="{{ item.name }}">{{ item.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-md border-slate-400 text-slate-600 mb-1">Model number</label><input
            name="model_number" class="w-full border rounded px-3 py-2 text-sm"></div>
        <div><label class="block text-md border-slate-400 text-slate-600 mb-1">Serial number</label><input
            name="serial_number" class="w-full border rounded px-3 py-2 text-sm"></div>
      </div>
      <div><label class="block text-md border-slate-400 text-slate-600 mb-1">Describe the issue</label>
        <textarea name="issue_description" rows="4" required class="w-full border rounded px-3 py-2 text-sm"></textarea>
      </div>
      <label class="flex items-center gap-2 text-md"><input type="checkbox" name="call_requested"> I'd like someone to
        call me</label>
      <button type="submit" class="w-full bg-slate-600 text-white rounded py-2 text-sm">Submit</button>
    </form>
  </div>
</body>

</html>
