{% extends "base.html" %}
{% block title %}Complete Service{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-2">Complete service — {{ record.item }}</h1>
<p class="text-sm text-slate-500 mb-6">Client: {{ record.client }} — Location: {{ record.location }}</p>
<div class="bg-white rounded border border-slate-200 p-6 max-w-2xl">
  <form method="POST" enctype="multipart/form-data" class="space-y-4">
    <div><label class="block text-sm font-medium mb-1">Issue reported by client</label>
      <textarea name="issue_reported" rows="3" required class="w-full border rounded px-3 py-2 text-sm"></textarea></div>
    <div><label class="block text-sm font-medium mb-1">Engineer assigned</label>
      <select name="engineer_assigned" required class="w-full border rounded px-3 py-2 text-sm">
        {% for eng in engineers %}<option value="{{ eng.name }}" {% if record.technician == eng.name %}selected{% endif %}>{{ eng.name }}</option>{% endfor %}
      </select></div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="block text-sm font-medium mb-1">Spare part / corrective measure used</label>
        <select name="part_used" class="w-full border rounded px-3 py-2 text-sm">
          <option value="">None</option>
          {% for item in items %}<option value="{{ item.name }}">{{ item.name }}</option>{% endfor %}
        </select></div>
      <div><label class="block text-sm font-medium mb-1">Quantity used</label>
        <input name="part_qty" type="number" min="0" value="1" class="w-full border rounded px-3 py-2 text-sm"></div>
    </div>
    <div><label class="block text-sm font-medium mb-1">Date completed</label>
      <input name="date_completed" type="date" required class="w-full border rounded px-3 py-2 text-sm"></div>
    <div><label class="block text-sm font-medium mb-1">Summary notes</label>
      <textarea name="notes" rows="3" class="w-full border rounded px-3 py-2 text-sm"></textarea></div>
    <div><label class="block text-sm font-medium mb-1">Upload scanned report (optional, if done on paper)</label>
      <input name="scan_file" type="file" accept="image/*,.pdf" class="w-full text-sm"></div>
    <button type="submit" class="bg-slate-900 text-white rounded px-4 py-2 text-sm">Complete service &amp; generate report</button>
  </form>
</div>
{% endblock %}
