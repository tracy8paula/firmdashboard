{% extends "base.html" %}
{% block title %}Complete Service{% endblock %}
{% block content %}


<section class="mb-10">
  <h1 class="text-2xl font-semibold text-slate-700 mb-2">Complete service — {{ record.item }}</h1>
  <p class="text-medium text-slate-500 mb-6">Client: {{ record.client }}</p>
  <div class="bg-white rounded-3xl border border-slate-300 p-4 w-full">
    <form method="POST" class="space-y-6 max-w-2xl mx-auto">
      <div>
        <label class="block text-l font-medium text-slate-700 mb-1">Issue reported by client</label>
        <textarea name="issue_reported" rows="3" required
          class="w-full border border-slate-300 rounded px-3 py-2 text-sm"></textarea>
      </div>
      <div>
        <label class="block text-l font-medium text-slate-700 mb-1">Engineer assigned</label>
        <select name="engineer_assigned" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm">
          {% for eng in engineers %}
          <option value="{{ eng }}" {% if record.technician==eng %}selected{% endif %}>{{ eng }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-l font-medium text-slate-700 mb-1">Spare part / corrective measure used</label>
          <select name="part_used" class="w-full border border-slate-300 rounded px-3 py-2 text-sm">
            <option value="">None</option>
            {% for item in items %}
            <option value="{{ item.name }}">{{ item.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-l font-medium text-slate-700 mb-1">Quantity used</label>
          <input name="part_qty" type="number" min="0" value="1"
            class="w-full border border-slate-300 rounded px-3 py-2 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-l font-medium text-slate-700 mb-1">Date completed</label>
        <input name="date_completed" type="date" required
          class="w-full border border-slate-300 rounded px-3 py-2 text-sm">
      </div>

      <div>
        <label class="block text-l font-medium text-slate-700 mb-1">Summary notes</label>
        <textarea name="notes" rows="3" placeholder="Add any additional summary notes"
          class="w-full border border-slate-300 rounded px-3 py-2 text-sm"></textarea>
      </div>
      <button type="submit" class="bg-slate-700 text-white rounded px-4 py-2 text-sm font-medium hover:bg-slate-550">
        Complete service & generate report
      </button>
    </form>
  </div>
</section>
{% endblock %}
