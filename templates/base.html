<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Medical Ops Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

  {% if session.get('role') %}
  <nav class="bg-slate-900 text-white px-6 py-3 flex items-center justify-between">
    <div class="font-semibold">Medical Ops Dashboard</div>
    <div class="flex items-center gap-4 text-sm">
      <span class="text-slate-300">{{ session.get('name') }}</span>
      <a href="{{ url_for('logout') }}" class="text-slate-300 hover:text-white underline">Sign out</a>
    </div>
  </nav>
  {% endif %}

  <main class="max-w-5xl mx-auto px-6 py-8">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="mb-4 rounded bg-green-50 border border-green-200 text-green-800 px-4 py-2 text-sm">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
